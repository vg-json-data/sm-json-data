# workflow name
name: "Run scripts"

# Runs manually from menu or weekly on Sundays at 18:00 UTC
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

# The built-in token is only used to check out the repository.
# We obtain an app token as a step in workflow, and use it to
# create the PR, because this allows the PR to automatically run its
# Sanity Checks; otherwise manual approval would be needed.
permissions:
  contents: read

jobs:
  # Run scripts
  run_standard_scripts:
    name: "Run standard scripts and open PR"
    runs-on: ${{ matrix.os-name }}
    environment: run-scripts-automation

    strategy:
      matrix:
        os-name: [
          ubuntu-latest
        ]
        python-version: [
          "3.10"
        ]

    steps:
      # checkout commit
      - name: ✔️Checkout commit
        uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false
      # install python
      - name: 💿Install Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # python version
      - name: 🐍Python Version
        shell: bash
        run: |
          python --version
      # python modules
      - name: 🐍Python Modules
        shell: bash
        run: |
          python -m pip install -r "./resources/app/manifests/pip_requirements.txt"
      # Analyze used GitHub Actions
      - name: Analyze used GitHub Actions
        shell: bash
        run: |
          python ./resources/ci/common/list_actions.py
      # Run Strat ID validator
      # Run Autoformatter
      - name: Run Strat ID Generator
        working-directory: scripts
        run: python populate_strat_ids.py
      - name: Run Tech ID Generator
        working-directory: scripts
        run: python populate_tech_ids.py
      - name: Run Autoformatter
        working-directory: scripts
        run: python autoformat.py
      # Use the app identity so PR creation and updates trigger Sanity Checks.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: Run Strat ID, Tech ID, and Notable ID Generator & Autoformatter
          title: Run Scripts
          body: This PR is auto-generated.
          base: master
          labels: Run Scripts
          branch: auto-run-scripts
          delete-branch: true
